# Overlay merged into the hermes-exercise profile's own config.yaml by run.py.
# Only the keys this project adds — Hermes's own defaults for everything else are untouched.
mcp_servers:
  trade-compliance:
    command: "__PYTHON_EXECUTABLE__"
    args:
      - "-m"
      - "trade_tools.trade_mcp.server"
    env:
      PYTHONPATH: "__REPO_ROOT__"
      TRADE_GOV_API_KEY: "${TRADE_GOV_API_KEY}"
    enabled: true
    tools:
      # MCP has three primitives — tools, resources and prompts — and Hermes registers a
      # discovery tool for each family a server advertises (list_resources, read_resource,
      # list_prompts, get_prompt). This server exposes two tools and nothing else, but FastMCP
      # advertises the resources and prompts capabilities unconditionally, so Hermes correctly
      # believes there is something to browse and offers the agent four extra tools that can
      # only ever return empty.
      #
      # Not free: four schemas in every prompt, and models do go looking. qwen2.5:3b spent two
      # of its calls on list_prompts/list_resources before answering.
      #
      # Discovery earns its place when a server holds many or changing items — a filesystem, a
      # document store, PST.AG's 250+ trade agreements. It is pure overhead when the tool list
      # is two items long and fixed.
      resources: false
      prompts: false

# Stated explicitly rather than left unset. run.py merges this overlay into whatever the
# profile already holds, so an unset key keeps its previous value — switch from handoff back
# to single and MEMORY.md stays injected, feeding the agent yesterday's screening result
# instead of a live one. Sanctions lists change; a cached "clean" is the worst possible answer.
# Same lesson as the provider block in run.py: merge is right until the key is a mode switch.
memory:
  memory_enabled: false
  user_profile_enabled: false

# Toolsets are looked up per PLATFORM (hermes_cli/tools_config.py). The CLI and the
# gateway are different platforms — the gateway identifies as "api_server"
# (gateway/platforms/api_server.py) — so a cli-only entry silently leaves the web UI
# running Hermes's full default toolset. Both must be listed.
platform_toolsets:
  cli:
    - trade-compliance
  api_server:
    - trade-compliance

