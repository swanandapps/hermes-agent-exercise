# Model overlay — the SECOND open-weight model. Selected by MODEL=llama.
#
# Part 3 asks for two different open-weight, self-hostable models. This is the other one:
# a different vendor and a different architecture from Qwen3-32B, deliberately chosen small
# enough (8B) to genuinely run on consumer hardware — which is what makes the "self-hostable"
# claim real rather than theoretical. It is also the same family as the local Ollama overlay,
# so the same weights can be demonstrated on a cloud endpoint and on a laptop.
#
# Smaller models are markedly weaker at tool calling, and every answer in this agent comes from
# a tool call. See docs/performance.md for how it actually behaved.
model:
  provider: openrouter
  default: meta-llama/llama-3.1-8b-instruct
  key_env: OPENROUTER_API_KEY
  context_length: 131072
  max_tokens: 4096   # cap the per-call output reservation (see model.openrouter.yaml)
