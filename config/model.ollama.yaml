# Model overlay — OPEN-WEIGHT, SELF-HOSTED locally via Ollama. Selected by MODEL=ollama.
# This is the "self-hostable" half of Part 3; config/model.openrouter.yaml is the cloud half.
#
#   ollama pull qwen2.5:3b
#   MODEL=ollama python run.py --mode single
#
# Hermes enforces a 64K minimum context (agent/model_metadata.py: MINIMUM_CONTEXT_LENGTH) and it
# checks the context Ollama ACTUALLY loaded, not what we declare here — so ollama_num_ctx must be
# 65536 as well. There is no way to satisfy the floor while quietly allocating a smaller window.
#
# On an 8GB machine that, not the weights, is the binding constraint: qwen2.5:3b is only 1.9GB, but
# a 64K KV cache on top of it is what exhausts memory. See docs/performance.md for what actually
# happened when this was run.
model:
  provider: custom          # aliases: ollama, local, vllm, llamacpp
  default: qwen2.5:3b
  base_url: http://localhost:11434/v1
  key_env: OLLAMA_API_KEY   # any value; Ollama ignores it
  context_length: 65536
  ollama_num_ctx: 65536     # maps to extra_body.options.num_ctx
  max_tokens: 4096
