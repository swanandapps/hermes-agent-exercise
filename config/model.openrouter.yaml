# Model overlay — OPEN-WEIGHT via a CLOUD endpoint (OpenRouter). Selected by MODEL=openrouter.
#
# This carries the real inference for the live demo. Hermes enforces a 64K minimum context
# (agent/model_metadata.py: MINIMUM_CONTEXT_LENGTH) and this project's system prompt alone runs
# ~30K tokens, so a small locally-hosted model cannot serve the full agent on an 8GB machine.
# Ollama (config/model.ollama.yaml) is the self-hostable proof; this is the working backend.
#
# Qwen3-32B: Apache-2.0 weights, self-hostable on a single large GPU, 131K context, and among the
# more reliable open models at tool calling — the thing that actually has to survive the swap,
# since every answer in this agent comes from a tool call.
#
# `provider: openrouter` is Hermes's native provider (plugins/model-providers/openrouter), not the
# generic `custom` one — it carries per-model-family reasoning-parameter handling.
model:
  provider: openrouter
  default: qwen/qwen3-32b
  key_env: OPENROUTER_API_KEY
  context_length: 131072
  # Hermes defaults to requesting 65,536 output tokens per call. OpenRouter reserves
  # credit against that ceiling, so a request can be refused for "insufficient credits"
  # while the answer it would have produced costs a fraction of a cent. A compliance
  # memo is ~1,500 tokens; 4,096 is generous headroom.
  max_tokens: 4096
