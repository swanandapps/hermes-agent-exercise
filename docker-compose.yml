# Part 3 — the whole workflow, no Anthropic anywhere.
#
#   MODEL=openrouter docker compose up --build     # open weights via a cloud endpoint
#   MODEL=ollama     docker compose --profile ollama up --build   # self-hosted locally
#
# Then open http://localhost:8000
#
# Three services:
#   gateway  Hermes runtime + this project's MCP tools (stdio, so they share a container)
#   app      FastAPI relay + the built React UI; talks to the gateway over HTTP
#   ollama   local model server, only needed for MODEL=ollama
#
# For MODEL=openrouter the LLM is not containerised at all — that is a cloud API the
# gateway calls out to. Only the self-hosted path runs a model in a container.

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    environment:
      MODEL: ${MODEL:-openrouter}
      HERMES_MODE: ${HERMES_MODE:-handoff}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TRADE_GOV_API_KEY: ${TRADE_GOV_API_KEY:-}
      API_SERVER_KEY: ${API_SERVER_KEY:-hermes-exercise-local-dev-key}
      # Only consulted when MODEL=ollama. Service name, not localhost: inside the
      # compose network each service is reachable by its own name.
      # Defaults to the compose service. Override to point at an Ollama running on the host —
      # OLLAMA_BASE_URL=http://host.docker.internal:11434/v1 — which is the practical choice on a
      # laptop, since Docker Desktop's memory allowance is usually well below the machine's.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
    volumes:
      # Memory, session history and the synced profile outlive `docker compose down`.
      - hermes-profile:/data/hermes
    # Pinned resolvers. A CDN-fronted government API (data.trade.gov resolves through a
    # five-hop Azure chain) intermittently failed against a consumer router's DNS
    # forwarder during development — see "Three things that will bite you" in the README.
    # Pinning here means the deployment cannot inherit that problem from whatever host
    # it lands on.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8642/health"]
      interval: 10s
      timeout: 5s
      # Hermes takes ~25s to boot: it spawns the MCP subprocess and waits for tool
      # discovery before serving. start_period stops those first probes counting as
      # failures.
      start_period: 60s
      retries: 5
    ports:
      - "8642:8642"

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    environment:
      HERMES_GATEWAY_URL: http://gateway:8642
      API_SERVER_KEY: ${API_SERVER_KEY:-hermes-exercise-local-dev-key}
      HERMES_PROFILE: hermes
    volumes:
      # Read-only: the header reads the same config.yaml the gateway loaded, so the UI
      # cannot claim a model the agent is not actually running.
      - hermes-profile:/root/.hermes/profiles/hermes:ro
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "8000:8000"

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]        # only starts with: docker compose --profile ollama up
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    # First run needs the weights: docker compose exec ollama ollama pull qwen2.5:3b

volumes:
  hermes-profile:
  ollama-models:
